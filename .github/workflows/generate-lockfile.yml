name: Validar package-lock temporário

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/generate-lockfile.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalação reproduzível
        run: npm ci --no-audit --no-fund
      - name: Typecheck, testes e build
        run: npm run build
