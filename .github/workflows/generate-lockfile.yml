name: Gerar package-lock temporário

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/generate-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Salvar lockfile no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no lockfile."
          else
            git commit -m "Adiciona package-lock.json"
            git push
          fi
